<!DOCTYPE html>
<!-- GitHub Pages shows this page for any address that doesn't exist. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Vaibhav Garg</title>
    <meta name="robots" content="noindex">
    <script>
        // Old links used /portfolio/... (any capitalization) before the repo was
        // renamed. Send those to the same page on the main site.
        (function () {
            var m = location.pathname.match(/^\/portfolio(\/.*)?$/i);
            if (m) location.replace((m[1] || "/") + location.search + location.hash);
        })();
    </script>
    <style>
        body { background: #030712; color: #f1f5f9; font-family: "Inter", system-ui, -apple-system, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 0 24px; text-align: center; }
        h1 { font-size: clamp(56px, 14vw, 96px); margin: 0; background: linear-gradient(135deg, #818cf8, #f472b6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; margin: 8px 0 32px; }
        a { display: inline-block; padding: 14px 28px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>This page doesn't exist.</p>
        <a href="/">Go to Vaibhav Garg's portfolio</a>
    </main>
</body>
</html>
